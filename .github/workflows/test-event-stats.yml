name: Verifica statistiche pubbliche eventi
on:
  pull_request:
    paths:
      - 'metrics.js'
      - 'index.html'
      - 'event-stats.rules.json'
      - 'tests/event-stats*.cjs'
      - '.github/workflows/test-event-stats.yml'
      - 'scripts/sync-event-stats.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/event-stats.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.12.0
      - run: ./node_modules/.bin/firebase emulators:exec --only database --project demo-csf-event-stats --config event-stats-emulator.json 'node tests/event-stats-rules.cjs'
