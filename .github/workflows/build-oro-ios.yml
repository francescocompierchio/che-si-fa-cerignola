name: Genera e collauda musica originale iOS
on:
  push:
    branches: ['fix/audio-ios-20261126']
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installa codificatore MP3
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; fi
      - name: Renderizza il brano originale senza servizi esterni
        run: |
          set -euo pipefail
          node audio/render-oro.cjs /tmp/oro.wav
          ffmpeg -v error -y -i /tmp/oro.wav -map_metadata -1 -c:a libmp3lame -b:a 64k audio/oro-al-tramonto-v1.mp3
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate:format=duration -of json audio/oro-al-tramonto-v1.mp3
          node -e 'const fs=require("fs"); const n=fs.statSync("audio/oro-al-tramonto-v1.mp3").size; if(n<1000000||n>2000000)throw Error("dimensioni audio inattese");'
      - name: Installa browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Collaudo iPhone WebKit e Android Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/chesifa-http.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break || sleep 1; done
          node tests/music-compat.cjs
          node tests/browser-smoke.cjs
      - name: Salva soltanto il file audio verificato sul ramo di lavoro
        run: |
          set -euo pipefail
          git config user.name "CSF audio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/oro-al-tramonto-v1.mp3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audio MP3 originale Oro al tramonto, verificato"
          git push origin HEAD:fix/audio-ios-20261126
