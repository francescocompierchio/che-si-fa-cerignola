name: Collaudo reale segnalazioni Firebase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verifica-segnalazioni-live.yml']
permissions:
  contents: read
concurrency:
  group: csf-report-live-test
  cancel-in-progress: false
jobs:
  verifica:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 firebase-admin@13.6.0
          npx playwright install --with-deps chromium
      - name: Invio dal sito pubblico e verifica Firebase reale
        env:
          EVENT_STATS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.EVENT_STATS_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {randomUUID}=require('node:crypto');
          const {chromium}=require('playwright');
          const {initializeApp,cert,deleteApp}=require('firebase-admin/app');
          const {getDatabase}=require('firebase-admin/database');
          const credential=JSON.parse(process.env.EVENT_STATS_FIREBASE_SERVICE_ACCOUNT||'null');
          assert.equal(credential?.project_id,'chesifa-cerignola','Credenziale progetto non disponibile');
          const app=initializeApp({credential:cert(credential),databaseURL:'https://chesifa-cerignola-default-rtdb.europe-west1.firebasedatabase.app'});
          const db=getDatabase(app);
          const title='COLLAUDO NON PUBBLICARE '+randomUUID();
          const date=new Date(Date.now()+4*86400000).toISOString().slice(0,10);
          const data={titolo:title,luogo:'Locale fittizio di collaudo',citta:'Cerignola',dataInizio:date,dataTesto:'22:30',descrizione:'Test tecnico privato. Non è un evento reale e non deve essere pubblicato.'};
          let browser,page,key;
          (async()=>{
            try{
              browser=await chromium.launch();
              page=await browser.newPage({serviceWorkers:'block',viewport:{width:430,height:900}});
              await page.addInitScript(()=>localStorage.setItem('csf_escludi_visite','1'));
              await page.route('**/*',r=>/googletagmanager|google-analytics|cloudflareinsights/.test(new URL(r.request().url()).hostname)?r.abort():r.continue());
              await page.goto('https://francescocompierchio.github.io/che-si-fa-cerignola/?collaudo='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForFunction(()=>window.firebase?.apps?.length&&window.CsfQuick?.fields,{},{timeout:30000});
              // Observe the key generated by the actual SDK, without replacing its network behavior.
              await page.evaluate(()=>{
                const proto=window.firebase.database().ref('segnalazioniDaApprovare').constructor.prototype;
                const original=proto.push;
                proto.push=function(...args){
                  const result=original.apply(this,args);
                  if(this.key==='segnalazioniDaApprovare')window.csfLiveTestKey=result.key;
                  return result;
                };
              });
              const poster=await browser.newPage({viewport:{width:900,height:600}});
              await poster.setContent('<body style="font:36px Arial;padding:30px"><h1>COLLAUDO - NON PUBBLICARE</h1><p>Locale: Sala di prova</p><p>Comune: Cerignola</p><p>Data: '+date+'</p><p>Ore 22:30</p><p>Test tecnico privato</p></body>');
              const image=await poster.screenshot({type:'png'});await poster.close();
              await page.locator('#btn-segnala-evento').click();
              await page.locator('#seg-social').click();
              await page.locator('#quick-foto').setInputFiles({name:'collaudo.png',mimeType:'image/png',buffer:image});
              await page.waitForFunction(()=>!document.querySelector('#quick-invia').disabled&&!document.querySelector('#quick-details').hidden,{},{timeout:100000});
              await page.locator('#quick-edit-draft').click();
              for(const [k,v] of Object.entries(data))await page.locator('#quick-data-'+k).fill(v);
              await page.locator('#quick-invia').click();
              await page.waitForFunction(()=>!!window.csfLiveTestKey,{},{timeout:15000});
              key=await page.evaluate(()=>window.csfLiveTestKey);
              await page.waitForFunction(()=>document.querySelector('#quick-esito').textContent.includes('locandina ricevuti'),{},{timeout:30000});
              const ref=db.ref('segnalazioniDaApprovare/'+key);
              const saved=(await ref.get()).val();
              assert.ok(saved,'Record non persistito');
              for(const [k,v] of Object.entries(data))assert.equal(saved[k],k==='dataTesto'?'Ore '+v:v,k);
              assert.match(saved.screenshot,/^data:image\/jpeg;base64,/);
              assert.equal(saved.tipoSegnalazione,'Segnalazione rapida');
              console.log('OK: invio pubblico confermato da Firebase reale; record, dati e locandina verificati. ID '+key);
            }finally{
              if(!key&&page)key=await page.evaluate(()=>window.csfLiveTestKey).catch(()=>null);
              if(browser)await browser.close();
              try{
                if(key){
                  const ref=db.ref('segnalazioniDaApprovare/'+key);
                  const record=(await ref.get()).val();
                  if(record?.titolo===title){await ref.remove();assert.equal((await ref.get()).exists(),false);console.log('Record tecnico privato rimosso; nessuna pubblicazione.');}
                }
              }finally{await deleteApp(app);}
            }
          })().catch(e=>{console.error('COLLAUDO FALLITO: '+String(e.message).slice(0,400));process.exitCode=1;});
          NODE
