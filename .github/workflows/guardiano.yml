name: Guardiano tecnico 15 minuti

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/guardiano.yml"
      - "scripts/guardiano.py"
      - "scripts/test_guardiano.py"

permissions:
  actions: write
  contents: read

concurrency:
  group: guardiano-tecnico
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test del recupero controllato
        run: python -m unittest discover -s scripts -p test_guardiano.py -v
      - name: Verifica archivio e raccolta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/guardiano.py
