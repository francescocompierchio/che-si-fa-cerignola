name: Verifica interfaccia web

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - ".github/workflows/test-frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verifica sintassi JavaScript e controlli interattivi
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          assert.ok(scripts.length > 0, "Nessuno script inline trovato");
          scripts.forEach((source, index) => {
            try { new Function(source); }
            catch (error) { throw new Error("Script inline " + (index + 1) + ": " + error.message); }
          });
          const requiredIds = [
            "events-container", "filters", "search-input", "quick-all",
            "quick-weekend", "quick-favorites", "favorites-count",
            "sort-events", "surprise-me", "dock-home", "dock-weekend",
            "dock-saved", "dock-suggest", "app-toast", "btn-segnala-evento",
            "agenda-date-buttons", "clear-selected-date", "saved-plan-share", "btn-share-saved-plan",
            "notification-panel", "notification-status", "notification-reminder-count", "btn-notify-toggle", "notification-open-chrome"
          ];
          for (const id of requiredIds) {
            const count = html.split('id="' + id + '"').length - 1;
            assert.equal(count, 1, "ID " + id + ": atteso una sola occorrenza, trovate " + count);
          }
          assert.ok(html.includes("csf_eventi_preferiti_v1"), "Persistenza preferiti assente");
          assert.ok(html.includes("function eWeekend"), "Filtro weekend assente");
          assert.ok(html.includes("function renderAgendaRapida"), "Agenda settimanale assente");
          assert.ok(html.includes('data-smart-filter="COUPLE"'), "Filtro coppie assente");
          assert.ok(html.includes('data-smart-filter="FRIENDS"'), "Filtro amici assente");
          assert.ok(html.includes('data-smart-filter="NIGHT"'), "Filtro serate assente");
          assert.ok(html.includes('data-smart-filter="CULTURE"'), "Filtro cultura assente");
          const moveSource = html.match(/function spostaGiorniISO\(data,giorni\)\{[^}]*\}/);
          assert.ok(moveSource, "Funzione di calendario non trovata");
          const moveDate = new Function(moveSource[0] + "; return spostaGiorniISO;")();
          assert.equal(moveDate("2026-11-30", 1), "2026-12-01", "Cambio mese errato");
          assert.equal(moveDate("2026-12-31", 1), "2027-01-01", "Cambio anno errato");
          const countSource = html.match(/function contaEventiGiorno\(data\)\{[^}]*\}/);
          assert.ok(countSource, "Conteggio agenda non trovato");
          const countFactory = new Function("tuttiEventiAttivi", countSource[0] + "; return contaEventiGiorno;");
          const countDate = countFactory([
            {tipoContenuto:"evento",dataInizio:"2026-11-24",dataFine:"2026-11-24"},
            {tipoContenuto:"evento",dataInizio:"2026-11-23",dataFine:"2026-11-25"},
            {tipoContenuto:"esperienza",dataInizio:"2000-01-01",dataFine:"2099-12-31"}
          ]);
          assert.equal(countDate("2026-11-24"), 2, "Il conteggio agenda deve escludere le esperienze permanenti");
          const icsSource = html.match(/function creaTestoICS\(ev\)\{[\s\S]*?\n    \}/);
          assert.ok(icsSource, "Generatore file calendario non trovato");
          assert.ok(html.includes("function piegaRigaICS"), "Piegatura righe ICS assente");
          assert.ok(html.includes("function mostraNotificaDispositivo"), "Invio notifiche locali assente");
          const supportSource = html.match(/function valutaSupportoNotifiche\(contesto\) \{[\s\S]*?\n    \}/);
          assert.ok(supportSource, "Diagnostica compatibilità notifiche assente");
          const valutaSupporto = new Function(supportSource[0] + "; return valutaSupportoNotifiche;")();
          assert.equal(valutaSupporto({sicuro:false,api:true,richiediPermesso:true,android:true,serviceWorker:true,notificaPersistente:true}).codice, "https", "Controllo HTTPS errato");
          assert.equal(valutaSupporto({sicuro:true,api:false,richiediPermesso:false,android:true,serviceWorker:true,notificaPersistente:true}).codice, "api", "Diagnostica browser integrato errata");
          assert.equal(valutaSupporto({sicuro:true,api:true,richiediPermesso:true,android:true,serviceWorker:false,notificaPersistente:false}).codice, "service-worker", "Supporto Android senza Service Worker non rilevato");
          assert.equal(valutaSupporto({sicuro:true,api:true,richiediPermesso:true,android:true,serviceWorker:true,notificaPersistente:true}).supportato, true, "Chrome Android compatibile non riconosciuto");
          assert.ok(html.includes("intent://francescocompierchio.github.io/che-si-fa-cerignola/"), "Collegamento per aprire Chrome assente");
          assert.ok(html.includes("Apri la piattaforma in Chrome"), "Istruzioni per browser integrato assenti");
          assert.ok(html.includes("function controllaNuoviEventi"), "Controllo nuove pubblicazioni assente");
          assert.ok(html.includes("function alternaPromemoriaEvento"), "Promemoria individuali assenti");
          assert.ok(html.includes("Notification.requestPermission()"), "Richiesta permesso notifiche assente");
          const reminderSource = html.match(/function promemoriaPronto\(promemoria, dataCorrente\) \{[\s\S]*?\n    \}/);
          assert.ok(reminderSource, "Regola di scadenza promemoria non trovata");
          const isReminderDue = new Function(reminderSource[0] + "; return promemoriaPronto;")();
          assert.equal(isReminderDue({dataInizio:"2026-11-24",dataFine:"2026-11-25"},"2026-11-24"), true, "Promemoria del giorno non rilevato");
          assert.equal(isReminderDue({dataInizio:"2026-11-25",dataFine:"2026-11-25"},"2026-11-24"), false, "Promemoria futuro attivato in anticipo");
          assert.equal(isReminderDue({dataInizio:"2026-11-20",dataFine:"2026-11-23"},"2026-11-24"), false, "Promemoria scaduto non deve partire");
          const summarySource = html.match(/function riepilogoNuoviEventi\(nuovi\) \{[\s\S]*?\n    \}/);
          assert.ok(summarySource, "Riepilogo nuovi eventi non trovato");
          const makeNotificationSummary = new Function(summarySource[0] + "; return riepilogoNuoviEventi;")();
          assert.equal(makeNotificationSummary([{titolo:"Concerto"},{titolo:"Teatro"},{titolo:"Festival"}]), "3 nuovi eventi: Concerto · Teatro e altri 1");
          const sw = fs.readFileSync("sw.js", "utf8");
          assert.ok(sw.includes('const CACHE_NAME = "chesifa-shell-v6"'), "Versione cache service worker non aggiornata");
          assert.ok(sw.includes('addEventListener("notificationclick"'), "Apertura app dal tocco notifica assente");
          assert.ok(html.includes("function creaTestoPianoSalvati"), "Funzione condivisione piano salvato assente");
          const planSource = html.match(/function creaTestoPianoSalvati\(salvati\)\{[\s\S]*?\n    \}/);
          assert.ok(planSource, "Composizione piano salvato non trovata");
          const makePlan = new Function(planSource[0] + "; return creaTestoPianoSalvati;")();
          const planText = makePlan([
            {titolo:"Concerto in piazza",dataTesto:"Sab 28 Nov",luogo:"Piazza Duomo",citta:"Cerignola"},
            {tipoContenuto:"esperienza",titolo:"Gita al lago",dataTesto:"Idea per una gita",luogo:"Lago Capacciotti",citta:"Cerignola"}
          ]);
          assert.ok(planText.includes("Concerto in piazza"), "Evento non incluso nel piano condiviso");
          assert.ok(planText.includes("Gita al lago"), "Esperienza non inclusa nel piano condiviso");
          const manyPlan = makePlan(Array.from({length:13},(_,i)=>({titolo:"Proposta "+(i+1),dataTesto:"Da scoprire"})));
          assert.ok(manyPlan.includes("e altre 1 proposte salvate"), "Il riepilogo del piano non limita le voci condivise");

          const makeIcsFactory = new Function("isSafeHttpUrl", "APP_URL", "spostaGiorniISO", "piegaRigaICS", icsSource[0] + "; return creaTestoICS;");
          const makeIcs = makeIcsFactory(url => /^https?:\/\//.test(url), "https://example.test/", moveDate, line => line);
          const ics = makeIcs({
            titolo: "Serata, insieme",
            dataInizio: "2026-11-24",
            dataFine: "2026-11-25",
            citta: "Cerignola",
            luogo: "Piazza; centro",
            descrizione: "Prima riga\nSeconda riga",
            costo: "Ingresso libero",
            fonteUrl: "https://example.test/evento"
          });
          assert.ok(ics.includes("DTSTART;VALUE=DATE:20261124"), "Data iniziale ICS errata");
          assert.ok(ics.includes("DTEND;VALUE=DATE:20261126"), "La data finale ICS deve essere esclusiva");
          assert.ok(ics.includes("SUMMARY:Serata\\, insieme"), "Virgole del titolo non escapate");
          assert.ok(ics.includes("Prima riga\\nSeconda riga"), "A capo descrizione non escapato");
          assert.ok(ics.includes("LOCATION:Piazza\\; centro\\, Cerignola"), "Località ICS non escapata");
          assert.throws(() => makeIcs({dataInizio:"domani"}), /Data evento non valida/);
          assert.throws(() => makeIcs({dataInizio:"2026-11-25",dataFine:"2026-11-24"}), /Intervallo evento non valido/);


          assert.ok(html.includes("prefers-reduced-motion"), "Supporto movimento ridotto assente");
          const fridayShift = day => day === 6 ? -1 : day === 0 ? -2 : (5 - day + 7) % 7;
          const expectedShift = [-2, 4, 3, 2, 1, 0, -1];
          expectedShift.forEach((expected, day) => assert.equal(fridayShift(day), expected, "Calcolo weekend errato per weekday " + day));
          const normalize = value => value.toLocaleLowerCase("it").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
          assert.equal(normalize("Città"), "citta", "Ricerca senza accenti non valida");
          assert.deepEqual(normalize("Bosco e natura").split(/\s+/), ["bosco", "e", "natura"]);
          console.log("OK: " + scripts.length + " script inline, " + requiredIds.length + " ID, date weekend e normalizzazione ricerca verificate.");
          NODE
      - name: Configura Android SDK per diagnosticare l'APK
        uses: android-actions/setup-android@v3
      - name: Legge identità e firma dell'APK esistente
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK="app-release.apk"
          echo "===== PACKAGE / VERSION / SDK / PERMISSIONS ====="
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|launchable-activity:|uses-permission:)" || true
          echo "===== APPLICATION ID ====="
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK"
          echo "===== VERSION ====="
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK" || true
          echo "===== SIGNATURE CERTIFICATE ====="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" || true
          echo "===== DEX PACKAGE SUMMARY ====="
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only "$APK" | sed -n '1,120p'
