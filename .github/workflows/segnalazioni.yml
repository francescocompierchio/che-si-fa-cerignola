name: Pubblica Segnalazioni Approvate

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  elabora:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'approvato'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Analizza segnalazione con Gemini e aggiorna eventi.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python elabora_segnalazioni.py

      - name: Salva eventi.json su GitHub se ci sono novità
        run: |
          git config user.name "CheSiFa Bot"
          git config user.email "bot@users.noreply.github.com"
          git add eventi.json
          if ! git diff --cached --quiet; then
            git commit -m "Pubblica evento approvato da segnalazione"
            git push
          else
            echo "Nessuna modifica a eventi.json da salvare."
          fi
