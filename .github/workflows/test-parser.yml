name: Test qualità raccolta eventi

on:
  pull_request:
    branches:
      - main
    paths:
      - "aggiorna_eventi.py"
      - "apprendimento.py"
      - "discovery_locale.py"
      - "fonti_editori.py"
      - "radar_territorio.py"
      - "radar_apify.py"
      - "radar_meta.py"
      - "test_radar_meta.py"
      - "telegram_eventi.py"
      - "test_telegram_eventi.py"
      - "stato_raccolta.py"
      - "test_radar_territorio.py"
      - "test_aggiorna_eventi.py"
      - ".github/workflows/test-parser.yml"

permissions:
  contents: read

jobs:
  test-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v7

      - name: Configura Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4 pillow

      - name: Esegue i test automatici
        run: python -m unittest discover -s . -p "test_*.py" -v
