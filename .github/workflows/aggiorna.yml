name: Aggiorna Eventi Cerignola

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cerca nuovi eventi e aggiorna eventi.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python aggiorna_eventi.py

      - name: Salva modifiche su GitHub se ci sono novità
        run: |
          git config user.name "CheSiFa Bot"
          git config user.email "bot@users.noreply.github.com"
          git add eventi.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico eventi"
            git push
          else
            echo "Nessun nuovo evento da salvare."
          fi
