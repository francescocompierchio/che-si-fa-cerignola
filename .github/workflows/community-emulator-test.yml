name: Community - verifica regole su emulatore
on:
  push:
    branches: [feature/community-test-sicurezza]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installa strumenti di test senza credenziali
        run: npm install --no-save --no-package-lock firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.12.0
      - name: Esegui verifica isolata
        env:
          CI: 'true'
        run: |
          ./node_modules/.bin/firebase emulators:exec --only database --project demo-csf-community --config community-emulator.json 'CSFC_EMULATOR=1 FIREBASE_DATABASE_EMULATOR_HOST=127.0.0.1:9000 node --test tests/community-security.cjs'
