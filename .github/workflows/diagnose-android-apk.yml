name: Diagnostica APK Android

on:
  pull_request:
    branches: [main]
    paths:
      - "app-release.apk"
      - ".github/workflows/diagnose-android-apk.yml"

permissions:
  contents: read

jobs:
  inspect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Inspect application identity, manifest and signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK="app-release.apk"
          echo "===== APK FILE ====="
          ls -lh "$APK"
          sha256sum "$APK"
          echo "===== PACKAGE / VERSION / SDK / LAUNCHER ====="
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|launchable-activity:|uses-permission:)" || true
          echo "===== MANIFEST APPLICATION ID ====="
          apkanalyzer manifest application-id "$APK"
          echo "===== MANIFEST VERSION ====="
          apkanalyzer manifest version-code "$APK"
          apkanalyzer manifest version-name "$APK" || true
          echo "===== SIGNATURE CERTIFICATE ====="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" || true
          echo "===== APK CONTENTS (TOP LEVEL) ====="
          unzip -l "$APK" | sed -n '1,100p'
          echo "===== APP EMBEDDED HTML ====="
          unzip -p "$APK" assets/htmlapp/root/index.html || true
          echo
          echo "===== DECOMPILE NATIVE ACTIVITY ====="
          sudo apt-get update -qq
          sudo apt-get install -y apktool
          apktool d -f "$APK" -o /tmp/chesifa-apk >/dev/null
          echo "--- MainActivity smali location ---"
          find /tmp/chesifa-apk/smali* -name 'MainActivity.smali' -print
          echo "--- WebView / URL / permissions code ---"
          grep -R -n -E 'WebView;|setJavaScriptEnabled|setDomStorageEnabled|loadUrl|loadData|NotificationManager|POST_NOTIFICATIONS|requestPermissions|setWebViewClient|setWebChromeClient' /tmp/chesifa-apk/smali* 2>/dev/null | head -100 || true
          echo "--- Manifest ---"
          sed -n '1,220p' /tmp/chesifa-apk/AndroidManifest.xml
