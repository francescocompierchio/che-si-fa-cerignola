name: Verifica motore eventi

on:
  pull_request:
    branches: [main]
    paths:
      - "aggiorna_eventi.py"
      - "tests/**"
      - ".github/workflows/test-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install requests beautifulsoup4
      - name: Controlla sintassi Python
        run: python -m compileall -q aggiorna_eventi.py tests
      - name: Esegue test del motore eventi
        run: python -m unittest discover -s tests -v
