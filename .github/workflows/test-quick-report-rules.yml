name: Verifica regole segnalazioni
on:
  pull_request:
    paths:
      - 'docs/segnalazioni-validation.fragment.json'
      - 'tests/quick-report-rules.cjs'
      - '.github/workflows/test-quick-report-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.12.0
      - run: ./node_modules/.bin/firebase emulators:exec --only database --project demo-csf-event-stats --config event-stats-emulator.json 'node tests/quick-report-rules.cjs'
