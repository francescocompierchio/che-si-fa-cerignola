name: Verifica contatori Firebase in produzione
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verifica-contatori-live.yml']
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Leggi contatori pubblici senza modificare il database
        run: |
          node <<'NODE'
          const base="https://chesifa-cerignola-default-rtdb.europe-west1.firebasedatabase.app/statistiche/";
          (async()=>{
            for(const k of ["visiteTotali","visualizzazioniTotali","utentiOnline"]){
              const r=await fetch(base+k+".json",{signal:AbortSignal.timeout(15000),cache:"no-store"});
              if(!r.ok)throw Error(k+": HTTP "+r.status);
              const v=await r.json();
              if(k!=="utentiOnline"&&v!==null&&(!Number.isSafeInteger(v)||v<0))throw Error("Contatore visite non valido");
              if(k==="utentiOnline"&&v!==null&&(typeof v!=="object"||Array.isArray(v)))throw Error("Contatore online non valido");
              console.log(k+": "+(k==="utentiOnline"?Object.keys(v||{}).length:v??0));
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - name: Installa browser di verifica
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verifica i tre contatori e l'esclusione amministratore
        run: |
          node <<'NODE'
          const { chromium }=require("playwright");
          const assert=require("node:assert/strict");
          const site="https://francescocompierchio.github.io/che-si-fa-cerignola/";
          const db="https://chesifa-cerignola-default-rtdb.europe-west1.firebasedatabase.app/statistiche/";
          async function read(k){const r=await fetch(db+k+".json",{signal:AbortSignal.timeout(15000),cache:"no-store"});if(!r.ok)throw Error(k+": HTTP "+r.status);return r.json();}
          async function snapshot(){const [v,w,o]=await Promise.all(["visiteTotali","visualizzazioniTotali","utentiOnline"].map(read));return {visite:v??0,visualizzazioni:w??0,online:Object.keys(o||{}).length};}
          async function until(test){for(let i=0;i<20;i++){const v=await snapshot();if(test(v))return v;await new Promise(r=>setTimeout(r,1000));}throw Error("Incremento non osservato: "+JSON.stringify(await snapshot()));}
          (async()=>{
            const browser=await chromium.launch();
            async function pagina(admin=false){
              const p=await browser.newPage({viewport:{width:393,height:852},isMobile:true,serviceWorkers:"block"});
              await p.route("**/*",r=>/cloudflareinsights\.com|googletagmanager\.com|google-analytics\.com/.test(new URL(r.request().url()).hostname)?r.abort():r.continue());
              if(admin)await p.addInitScript(()=>localStorage.setItem("csf_escludi_visite","1"));
              p.on("console",m=>{if(m.type()==="warning"&&/Visualizzazioni Firebase|Contatori Firebase/.test(m.text()))console.log(m.text().slice(0,300));});
              return p;
            }
            try{
              const before=await snapshot();console.log("PRIMA "+JSON.stringify(before));
              const page=await pagina();
              await page.goto(site,{waitUntil:"domcontentloaded",timeout:30000});
              assert.equal(await page.evaluate(()=>window.CsfMetrics?.allowed()),false);
              assert.equal(await page.evaluate(()=>window.CsfMetrics?.aggregateAllowed()),true);
              for(const id of ["visits-pill","views-pill","live-pill"])await page.locator("#"+id).waitFor({state:"visible",timeout:25000});
              const home=await until(s=>s.visite>before.visite&&s.visualizzazioni>before.visualizzazioni&&s.online>=1);
              await page.waitForFunction(n=>Number(document.getElementById("total-views-count").textContent.replace(/\D/g,""))>=n,home.visualizzazioni+1367,{timeout:20000});
              console.log("HOME "+JSON.stringify(home));
              const visualizzazioniMostrate=Number((await page.locator("#total-views-count").textContent()).replace(/\D/g,""));
              const raw=await snapshot();
              assert.ok(visualizzazioniMostrate>=home.visualizzazioni+1367&&visualizzazioniMostrate<=raw.visualizzazioni+1367,"Totale storico + Firebase non coerente");
              console.log("VISIBILI "+JSON.stringify({visite:await page.locator("#total-visits-count").textContent(),visualizzazioni:await page.locator("#total-views-count").textContent(),online:await page.locator("#online-users-count").textContent()}));
              await page.goto(site+"eventi/weekend.html",{waitUntil:"domcontentloaded",timeout:30000});
              const evento=await until(s=>s.visualizzazioni>home.visualizzazioni);
              console.log("PAGINA EVENTI "+JSON.stringify(evento));
              await page.close();
              const preAdmin=await snapshot();
              const admin=await pagina(true);
              await admin.goto(site,{waitUntil:"domcontentloaded",timeout:30000});
              assert.equal(await admin.evaluate(()=>window.CsfMetrics?.aggregateAllowed()),false);
              await admin.locator("#views-pill").waitFor({state:"visible",timeout:25000});
              await admin.waitForFunction(()=>!!window.CsfPublicViews,{},{timeout:20000});
              await new Promise(r=>setTimeout(r,3000));
              const adminHome=await snapshot();
              console.log("ADMIN PRIMA "+JSON.stringify(preAdmin)+" DOPO "+JSON.stringify(adminHome));
              await admin.goto(site+"eventi/weekend.html",{waitUntil:"domcontentloaded",timeout:30000});
              assert.equal(await admin.evaluate(()=>window.CsfMetrics?.aggregateAllowed()),false);
              await admin.waitForFunction(()=>!!window.CsfPublicViews,{},{timeout:20000});
              await new Promise(r=>setTimeout(r,3000));
              const adminEvent=await snapshot();console.log("ADMIN EVENTI "+JSON.stringify(adminEvent));
              if(adminEvent.visite!==preAdmin.visite||adminEvent.visualizzazioni!==preAdmin.visualizzazioni)console.log("ADMIN: variazioni globali osservate; eventuali accessi concorrenti rendono il confronto numerico non conclusivo.");
              else console.log("ADMIN: nessun incremento osservato.");
              await admin.close();
              console.log("ESITO: incrementi reali e visualizzazione verificati; test admin con preferenza di esclusione attiva.");
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
