name: Aggiorna Eventi Cerignola

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aggiorna_eventi.py"
      - "stato_raccolta.py"
      - "test_stato_raccolta.py"
      - "genera_pagine_eventi.js"
      - "event-tools.js"
      - "index.html"
      - "collabora.html"
      - "tests/seo-integrity.cjs"
      - ".github/workflows/aggiorna-eventi.yml"

concurrency:
  group: raccolta-eventi-cerignola
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Configura Node.js per il generatore SEO
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          pip install requests beautifulsoup4 lxml pillow pytesseract

      - name: Ripristina memoria delle fonti
        uses: actions/cache/restore@v4
        with:
          path: .csf-state
          key: fonti-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fonti-v1-

      - name: Pulisce report e salva copia precedente
        run: |
          rm -f report_copertura.json
          cp eventi.json backup-eventi.json

      - name: Verifica parser, categorie e indirizzi
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Cerca nuovi eventi e aggiorna eventi.json
        env:
          PYTHONUNBUFFERED: "1"
          OMP_THREAD_LIMIT: "1"
          CSF_FORZA_FONTI: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python aggiorna_eventi.py

      - name: Salva memoria delle fonti
        uses: actions/cache/save@v4
        with:
          path: .csf-state
          key: fonti-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pubblica riepilogo della raccolta
        if: always()
        run: |
          if [ -f report_copertura.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("report_copertura.json").read_text(encoding="utf-8"))
          print("## Riepilogo raccolta eventi")
          print(f"- Aggiornato: {report.get('aggiornatoAl', 'n/d')} ({report.get('fusoOrario', 'fuso non specificato')})")
          print(f"- Eventi nell'archivio: {report.get('totaleContenuti', 0)}")
          print(f"- Nuovi eventi rispetto all'archivio: {report.get('nuoviAggiunti', 0)}")
          print(f"- Eventi già presenti ritrovati: {report.get('automaticiRitrovati', 0)}")
          print(f"- Eventi a Cerignola nei prossimi 7 giorni: {report.get('eventiCerignolaProssimi7Giorni', 0)}")
          print(f"- Serate automatiche a Cerignola: {report.get('serateCerignola', 0)}")
          print(f"- Eventi con concordanza esatta tra domini diversi: {report.get('eventiConcordanti', 0)}")
          print(f"- Schede ricontrollate: {report.get('controlloStato', {}).get('schedeLette', 0)}")
          print(f"- Record esclusi per stato esplicito: {report.get('recordEsclusiPerStato', 0)}")
          print(f"- Durata raccolta: {report.get('durataSecondi', 0)} secondi")
          print(f"- Domini contemporanei massimi: {report.get('workerMassimi', 1)}")
          print(f"- Eventi automatici riconvalidati: {report.get('automaticiRiconvalidati', 0)}")
          print(f"- Eventi manuali JSON protetti: {report.get('manualiConservati', 0)}")
          print(f"- Scaduti rimossi: {report.get('scadutiEliminati', 0)}")
          salute = report.get("saluteFonti", {})
          print("### Salute delle fonti")
          print(f"- Fonti monitorate: {salute.get('fontiMonitorate', 0)}")
          print(f"- Fonti in pausa: {', '.join(salute.get('fontiInPausa', [])) or 'nessuna'}")
          print(f"- Fonti da rivedere: {', '.join(salute.get('fontiDaRivedere', [])) or 'nessuna'}")
          if not report.get("serateCerignola", 0):
              print("**Attenzione:** nessuna serata automatica a Cerignola nell'archivio.")
          print("### Distribuzione per comune")
          for comune, count in sorted(report.get("eventiPerComune", {}).items(), key=lambda x: (-x[1], x[0])):
              print(f"- {comune}: {count}")
          print("### Distribuzione per fonte")
          for fonte, count in sorted(report.get("eventiPerFonte", {}).items(), key=lambda x: (-x[1], x[0])):
              print(f"- {fonte}: {count}")
          print("### Esito interrogazione fonti")
          print(f"- Fonti che hanno restituito eventi: {report.get('fontiConEventi', 0)}")
          print(f"- Fonti senza eventi: {len(report.get('fontiSenzaEventi', []))}")
          for fonte, dati in sorted(report.get("diagnosticaFonti", {}).items()):
              print(
                  f"- {fonte}: {dati.get('stato', 'n/d')}; "
                  f"{dati.get('linkCandidati', 0)} schede candidate, "
                  f"{dati.get('pagineScaricate', 0)} pagine lette, "
                  f"{dati.get('eventiEstratti', 0)} eventi, "
                  f"{dati.get('durataSecondi', 0)} s; "
                  f"{dati.get('tentativiOCR', 0)} tentativi OCR"
              )
          PY
          else
            echo "Il report di copertura non è stato generato." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserva report di copertura per 14 giorni
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copertura-eventi-${{ github.run_id }}
          path: |
            report_copertura.json
            backup-eventi.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verifica integrità SEO e aggiornamento archivio
        run: node tests/seo-integrity.cjs

      - name: Genera pagine HTML e sitemap SEO
        run: node genera_pagine_eventi.js

      - name: Salva modifiche su GitHub se ci sono novità
        id: salva
        run: |
          git config user.name "CheSiFa Bot"
          git config user.email "bot@users.noreply.github.com"
          git add eventi.json eventi/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico eventi"
            git pull --rebase origin main || (git rebase --abort && git pull --no-rebase origin main)
            git push origin main || (git pull --rebase origin main && git push origin main)
            echo "modifiche=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nessun nuovo evento da salvare."
          fi

      - name: Richiede pubblicazione Pages dopo aggiornamento automatico
        if: steps.salva.outputs.modifiche == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent; then
            echo "::warning::Richiesta build Pages non riuscita: controllare i permessi e la sorgente Pages."
          fi
