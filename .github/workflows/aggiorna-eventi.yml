name: Aggiorna Eventi Cerignola

on:
  pull_request:
    branches: [main]
    paths:
      - "aggiorna_eventi.py"
      - "tests/**"
      - ".github/workflows/aggiorna-eventi.yml"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install requests beautifulsoup4
      - name: Controlla sintassi Python
        run: python -m compileall -q aggiorna_eventi.py tests
      - name: Esegue test del motore eventi
        run: python -m unittest discover -s tests -v

  aggiorna:
    needs: test-discovery
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Cerca nuovi eventi e aggiorna eventi.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python aggiorna_eventi.py

      - name: Salva modifiche su GitHub se ci sono novità
        run: |
          git config user.name "CheSiFa Bot"
          git config user.email "bot@users.noreply.github.com"
          git add eventi.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico eventi"
            git pull --rebase origin main || (git rebase --abort && git pull --no-rebase origin main)
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "Nessun nuovo evento da salvare."
          fi
