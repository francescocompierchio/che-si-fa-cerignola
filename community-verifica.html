<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verifica accesso Community</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f2f5f8;color:#173047;margin:0;padding:24px}main{max-width:500px;margin:auto;background:white;border-radius:16px;padding:24px}button{font:inherit;padding:12px;border:1px solid #aab8c5;border-radius:8px;background:#20374a;color:white;margin:6px 0}button:disabled{opacity:.6}#status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#4f6170}</style>
</head><body><main><h1>Verifica accesso Community</h1><p>Test di accesso Google e lettura dei tuoi permessi. Non apre la chat, non invia messaggi e non modifica il database.</p><button id="login" disabled>Accedi con Google</button> <button id="logout" disabled>Esci</button><p id="status" role="status">Caricamento…</p><small>Non condividere password o token. La registrazione tramite Google può creare un account Firebase, se non esistente.</small></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
"use strict";
const status=document.getElementById("status"),login=document.getElementById("login"),logout=document.getElementById("logout");
try{
const app=firebase.initializeApp({
    apiKey: "AIzaSyDH4ZsFwaIctB-Gwa0-kShX_3-spoz8SwU",
    authDomain: "che-si-fa-community.firebaseapp.com",
    databaseURL: "https://che-si-fa-community-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "che-si-fa-community",
    appId: "1:1064417630484:web:a79933b1f5832f5e860a01"
  },"csf-community-check"),auth=app.auth(),db=app.database();
const err=e=>{status.textContent="Verifica non riuscita: "+(e.code||"errore di connessione")};
auth.setPersistence(firebase.auth.Auth.Persistence.NONE).then(()=>{
login.disabled=false;
auth.onAuthStateChanged(async u=>{
logout.disabled=!u;
if(!u){status.textContent="Accedi con lo stesso account Google del moderatore.";return;}
try{
const [m,o,b]=await Promise.all([db.ref("moderators/"+u.uid).once("value"),db.ref("settings/open").once("value"),db.ref("bans/"+u.uid).once("value")]);
status.textContent="Accesso Google: riuscito\nEmail verificata: "+(u.emailVerified?"Sì":"No")+"\nModeratore: "+(m.val()===true?"Sì":"No")+"\nChat aperta: "+(o.val()===true?"Sì":o.val()===false?"No":"Impostazione mancante")+"\nAccount sospeso: "+(b.val()===true?"Sì":"No")+(m.val()!==true?"\nUID del tuo account: "+u.uid:"");
}catch(e){err(e);}
},err);
}).catch(err);
login.onclick=async()=>{login.disabled=true;try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}catch(e){err(e);}finally{login.disabled=false;}};
logout.onclick=()=>auth.signOut().catch(err);
}catch(e){status.textContent="Impossibile inizializzare il servizio di verifica.";}
</script></body></html>
