<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Che Si Fa Cerignola</title>
<style>
body{margin:0;font-family:system-ui;background:#FFF7ED;color:#1c1917}
header{background:#C2410C;color:#fff;padding:22px 16px}
header h1{margin:0;font-size:30px}
header p{margin:6px 0 0;opacity:.9}
main{padding:16px;max-width:700px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.badge{display:inline-block;background:#FFEDD5;color:#9A3412;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.card h3{margin:8px 0 4px;font-size:20px}
.card p{margin:4px 0;color:#57534E}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0;box-sizing:border-box;font-size:16px}
button{background:#C2410C;color:#fff;border:0;padding:14px;border-radius:999px;width:100%;font-size:17px;font-weight:700}
.btn-green{background:#365314}
</style>
</head>
<body>
<header>
<h1>Che Si Fa Cerignola</h1>
<p>Tutti gli eventi di Cerignola e dintorni.</p>
</header>
<main>
<div id="lista"></div>
<div class="card">
<h3>Pubblica il tuo evento</h3>
<input id="titolo" placeholder="Titolo evento *">
<input id="luogo" placeholder="Luogo - es. Teatro Mercadante, Cerignola">
<input id="data" type="datetime-local">
<textarea id="desc" placeholder="Descrizione"></textarea>
<button class="btn-green" onclick="aggiungi()">Pubblica evento</button>
</div>
</main>
<script>
const EVENTI = [
{titolo:"Festival della Danza della Capitanata",data:"20 Nov 2026 - 17:00",luogo:"Teatro Mercadante, Cerignola",desc:"Festival di danza con 105 ballerini tra Cerignola, Manfredonia e Foggia.",citta:"Cerignola",cat:"Spettacolo"},
{titolo:"Bambinella a Palazzo",data:"21 Nov 2026 - 18:00",luogo:"Palazzo Fornari, Piazzale San Rocco, Cerignola",desc:"Due giorni per bambini e famiglie per le feste natalizie.",citta:"Cerignola",cat:"Famiglie"},
{titolo:"Natale nelle Quattro Vie",data:"21 Nov 2026 - 18:00",luogo:"Viale Roosevelt, Cerignola",desc:"Musica, luminarie e tombolate fino al 6 dicembre.",citta:"Cerignola",cat:"Natale"},
{titolo:"Mercatino di Autoproduzione e Artigianato",data:"22 Nov 2026 - 09:30",luogo:"Piazza Matteotti, Cerignola",desc:"Stand, uncinetto e laboratori gratuiti.",citta:"Cerignola",cat:"Mercatino"},
{titolo:"Baratto dei bambini",data:"22 Nov 2026 - 10:00",luogo:"Piazza Matteotti, Cerignola",desc:"Scambio di libri e giocattoli per i piu piccoli.",citta:"Cerignola",cat:"Famiglie"}
];
let extra = JSON.parse(localStorage.getItem("extra")||"[]");
function mostra(){
  let tutti = [...extra, ...EVENTI];
  document.getElementById("lista").innerHTML = tutti.map(e=>`<div class="card"><span class="badge">${e.citta} - ${e.cat}</span><h3>${e.titolo}</h3><p><b>${e.data}</b> - ${e.luogo}</p><p>${e.desc}</p></div>`).join("");
}
function aggiungi(){
  let t=document.getElementById("titolo").value;
  let l=document.getElementById("luogo").value;
  let d=document.getElementById("data").value;
  let de=document.getElementById("desc").value;
  if(!t) return alert("Metti il titolo");
  extra.unshift({titolo:t,data:d||"Da definire",luogo:l,desc:de,citta:"Cerignola",cat:"Locale"});
  localStorage.setItem("extra",JSON.stringify(extra));
  mostra(); alert("Pubblicato!");
}
mostra();
</script>
</body>
</html>
